<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap Styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="./styles/style.css">

    <title>JQuery Intro</title>
</head>
<body class="m-5">

    <h1>Introduction to jQuery</h1>
    <h2>Practicing jQuery Actions</h2>

    <!-- Paragraph -->
     <p class="m-5">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quaerat rem libero voluptates doloribus iusto, quisquam dignissimos, voluptas cupiditate voluptatibus, autem repellat. Quidem cupiditate at ipsum placeat iusto unde dolorem commodi?</p>

     <!-- Buttons to trigger actions -->
      <div class="d-flex flex-wrap gap-3 m-5">
        <!-- Button to learn how to trigger events/functions -->
         <button id="triggerEventBtn" class="btn btn-secondary">Trigger Event</button>


         <!-- Button to manipulate the paragraph and practice jquery actions -->
          <button id="hideP" class="btn btn-primary">Hide</button>
          <button id="showP" class="btn btn-success">Show</button>
          <button id="toggleP" class="btn btn-danger">Toggle</button>
          <button id="changePText" class="btn btn-warning">Change Text</button>
          <button id="applyCSS" class="btn btn-info">Apply CSS</button>
          <button id="applyCSSClass" class="btn btn-dark">Apply CSS Class</button>
      </div>

      <!-- jquery connection -->
       <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

      <!-- My Script -->
      <script src="./scripts/105-jquery-intro.js"></script>
</body>
</html>
